name: Deploy to axeltagrou.fr

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP (curl)
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.vercel/*' \
            ! -name '.env' \
            ! -name 'deploy.ps1' \
            ! -name '*.py' \
            ! -name '*.bat' \
            ! -name 'README.md' \
            ! -name '.ovhconfig' \
            | while IFS= read -r file; do
              remote="${file#./}"
              curl --silent --show-error \
                -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
                --ftp-create-dirs \
                -T "$file" \
                "ftp://${{ secrets.FTP_SERVER }}/www/$remote" || echo "WARN: failed $file"
            done
          echo "Deploy complete."
